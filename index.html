<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="حفظ سريع" />
  <link rel="manifest" href="/manifest.json" />
  <title>حفظ سريع</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #0d2b36 0%, #071318 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 32, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .icon-box {
      width: 64px; height: 64px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px; color: #10b981;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
    .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .badge { background: rgba(255,255,255,0.06); padding: 5px 12px; border-radius: 8px; font-size: 12px; color: #cbd5e1; }
    .input-wrap { position: relative; margin-bottom: 14px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 14px;
      text-align: left;
      direction: ltr;
      outline: none;
    }
    input:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: block;
      text-decoration: none;
    }
    .btn-primary { background: #10b981; color: #042f2e; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-save { background: #3b82f6; color: #fff; margin-top: 12px; }
    .status { margin-top: 14px; font-size: 13px; color: #fbbf24; min-height: 20px; }
    .error { color: #f87171; }
    .preview { margin-top: 18px; display: none; background: rgba(0,0,0,0.3); padding: 14px; border-radius: 16px; }
    .preview img { width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; margin-bottom: 10px; }
    .preview-title { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">↓</div>
    <h1>حفظ سريع</h1>
    <p class="sub">انسخ رابط أي فيديو ثم الصقه هنا لحفظه مباشرة في ألبوم الكاميرا</p>
    <div class="badges">
      <span class="badge">YouTube</span>
      <span class="badge">TikTok</span>
      <span class="badge">Instagram</span>
      <span class="badge">X</span>
    </div>

    <div class="input-wrap">
      <input type="text" id="urlInput" placeholder="الصق رابط الفيديو هنا..." autocomplete="off" />
    </div>

    <button class="btn btn-primary" id="fetchBtn" onclick="handleStart()">لصق وتحميل الآن</button>
    <div class="status" id="statusText"></div>

    <div class="preview" id="previewBox">
      <img id="thumbImg" src="" alt="" />
      <div class="preview-title" id="videoTitle"></div>
      <button class="btn btn-save" id="saveBtn" onclick="downloadForPhone()">حفظ الفيديو في الجوال</button>
    </div>
  </div>

  <script>
    let currentStreamUrl = "";
    let currentFilename = "video.mp4";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function extractUrl(raw) {
      const match = raw.match(/https?:\/\/[^\s]+/);
      return match ? match[0] : "";
    }

    async function handleStart() {
      const input = document.getElementById("urlInput");
      let url = extractUrl(input.value);

      if (!url && navigator.clipboard && navigator.clipboard.readText) {
        try {
          const clip = await navigator.clipboard.readText();
          url = extractUrl(clip || "");
        } catch (e) {}
      }

      if (!url) {
        setStatus("اضغط داخل المربع أعلاه واختر (لصق) ثم اضغط الزر الأخضر.", true);
        input.focus();
        return;
      }

      input.value = url;
      const btn = document.getElementById("fetchBtn");
      btn.disabled = true;
      document.getElementById("previewBox").style.display = "none";
      setStatus("جاري تجهيز الفيديو بأعلى جودة...");

      try {
        const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "تعذر قراءة الرابط");

        currentFilename = `${data.title || "video"}.mp4`;
        currentStreamUrl = `/api/stream?url=${encodeURIComponent(url)}&title=${encodeURIComponent(data.title || "video")}`;

        document.getElementById("videoTitle").textContent = data.title || "فيديو جاهز";
        const img = document.getElementById("thumbImg");
        if (data.thumbnail) {
          img.src = data.thumbnail;
          img.style.display = "block";
        } else {
          img.style.display = "none";
        }

        document.getElementById("previewBox").style.display = "block";
        setStatus("الفيديو جاهز! اضغط الزر الأزرق بالأسفل.");
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function downloadForPhone() {
      if (!currentStreamUrl) return;
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "جاري سحب الفيديو للجوال...";
      setStatus("يرجى الانتظار ثوانٍ حتى يكتمل التحميل...");

      try {
        if (isIOS && navigator.canShare) {
          const response = await fetch(currentStreamUrl);
          if (!response.ok) throw new Error("فشل جلب ملف الفيديو");
          const blob = await response.blob();
          const file = new File([blob], currentFilename, { type: "video/mp4" });

          if (navigator.canShare({ files: [file] })) {
            setStatus("اختر (حفظ الفيديو / Save Video) من القائمة التي ستظهر الآن.");
            await navigator.share({ files: [file], title: currentFilename });
            setStatus("تم الحفظ بنجاح!");
            return;
          }
        }
        window.location.href = currentStreamUrl;
        setStatus("بدأ التنزيل في المتصفح.");
      } catch (err) {
        if (err.name !== "AbortError") {
          window.location.href = currentStreamUrl;
        }
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ الفيديو في الجوال";
      }
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("statusText");
      el.textContent = msg;
      el.className = isError ? "status error" : "status";
    }
  </script>
</body>
</html>
