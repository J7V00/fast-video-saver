<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حفظ سريع | تحميل الفيديوهات</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05080f">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05080f;
            --card: rgba(13, 20, 33, 0.72);
            --border: rgba(56, 189, 248, 0.16);
            --primary: #06b6d4;
            --secondary: #10b981;
            --glow: rgba(6, 182, 212, 0.35);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.4), transparent 50%, rgba(16, 185, 129, 0.4));
            z-index: -1;
            filter: blur(12px);
            opacity: 0.7;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 36px 26px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .logo-ring {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
        }

        .logo-ring svg {
            width: 32px;
            height: 32px;
            color: #22d3ee;
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 8px;
            letter-spacing: -0.3px;
            background: linear-gradient(to left, #ffffff, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.6;
        }

        .platforms {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 26px;
            flex-wrap: wrap;
        }

        .pill {
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #a5f3fc;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 17px 18px 17px 46px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 8, 15, 0.85);
            color: #ecfeff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
            direction: ltr;
            text-align: left;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
        }

        .clear-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #041014;
            border: none;
            padding: 17px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 12px 30px -6px var(--glow);
            transition: all 0.25s ease;
        }

        .main-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px -6px rgba(16, 185, 129, 0.45);
        }

        .main-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(4, 16, 20, 0.25);
            border-top-color: #041014;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-box {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            min-height: 22px;
            color: #22d3ee;
        }

        .status-error { color: #fb7185; }
        .status-success { color: #34d399; }

        #preview {
            margin-top: 22px;
            display: none;
            background: rgba(5, 8, 15, 0.75);
            padding: 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thumb-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        #preview img {
            width: 100%;
            max-height: 195px;
            object-fit: cover;
            display: block;
        }

        .platform-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            color: #22d3ee;
        }

        #videoTitle {
            font-size: 14px;
            font-weight: 600;
            margin: 12px 4px 2px;
            color: #e2e8f0;
            text-align: right;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo-ring">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
        </div>

        <h1>حفظ سريع</h1>
        <p class="subtitle">انسخ رابط أي فيديو وافتح التطبيق ليبدأ التنزيل فوراً بأعلى جودة</p>

        <div class="platforms">
            <span class="pill">TikTok</span>
            <span class="pill">Instagram</span>
            <span class="pill">YouTube</span>
            <span class="pill">X</span>
        </div>

        <div class="input-wrapper">
            <input type="url" id="urlInput" placeholder="https://..." autocomplete="off" oninput="toggleClearBtn()">
            <button class="clear-btn" id="clearBtn" onclick="clearInput()" title="مسح">✕</button>
        </div>

        <button class="main-btn" id="downloadBtn" onclick="handleVideo()">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">لصق وتحميل الآن</span>
        </button>

        <div class="status-box" id="status"></div>

        <div id="preview">
            <div class="thumb-container">
                <img id="thumb" src="" alt="معاينة">
                <span class="platform-tag" id="platformTag">HD</span>
            </div>
            <div id="videoTitle"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "";
    let lastProcessedUrl = "";

    window.addEventListener('focus', checkClipboardAndRun);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkClipboardAndRun();
    });

    function toggleClearBtn() {
        const input = document.getElementById('urlInput');
        document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'flex' : 'none';
    }

    function clearInput() {
        const input = document.getElementById('urlInput');
        input.value = "";
        lastProcessedUrl = "";
        toggleClearBtn();
        document.getElementById('preview').style.display = 'none';
        document.getElementById('status').innerText = "";
        input.focus();
    }

    async function checkClipboardAndRun() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && isValidUrl(text) && text !== lastProcessedUrl) {
                document.getElementById('urlInput').value = text;
                toggleClearBtn();
                handleVideo();
            }
        } catch (err) {}
    }

    function isValidUrl(str) {
        return str.startsWith('http://') || str.startsWith('https://');
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('downloadBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        btn.disabled = isLoading;
        spinner.style.display = isLoading ? 'block' : 'none';
        btnText.innerText = isLoading ? 'جاري التحميل...' : 'لصق وتحميل الآن';
    }

    async function handleVideo() {
        const input = document.getElementById('urlInput');
        const status = document.getElementById('status');
        const preview = document.getElementById('preview');

        if (!input.value.trim()) {
            try {
                const clipText = await navigator.clipboard.readText();
                if (isValidUrl(clipText)) {
                    input.value = clipText;
                    toggleClearBtn();
                }
            } catch (e) {}
        }

        const url = input.value.trim();
        if (!isValidUrl(url)) {
            status.className = "status-box status-error";
            status.innerText = "الرجاء نسخ رابط فيديو صحيح أولاً";
            return;
        }

        lastProcessedUrl = url;
        setLoading(true);
        status.className = "status-box";
        status.innerText = "جاري جلب الفيديو...";
        preview.style.display = "none";

        try {
            const res = await fetch(`${API_BASE}/api/info?url=${encodeURIComponent(url)}`);
            const data = await res.json();

            if (!res.ok) throw new Error(data.detail || "تعذر قراءة الرابط");

            if (data.thumbnail) {
                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('platformTag').innerText = (data.platform || "HD").toUpperCase();
                preview.style.display = "block";
            }

            status.className = "status-box status-success";
            status.innerText = "تم! جاري حفظ الفيديو على جهازك...";

            const streamUrl = `${API_BASE}/api/stream?url=${encodeURIComponent(url)}&title=${encodeURIComponent(data.title)}`;
            window.location.href = streamUrl;

            setTimeout(() => {
                setLoading(false);
            }, 2500);

        } catch (error) {
            status.className = "status-box status-error";
            status.innerText = error.message;
            setLoading(false);
        }
    }
</script>

</body>
</html>
